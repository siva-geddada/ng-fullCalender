<main class="demo">
  <header class="demo__header">
    <h1>ng-fullCalender</h1>
    <button type="button" (click)="toggleTheme()">{{ theme() === 'dark' ? 'Light' : 'Dark' }} theme</button>
  </header>

  <sch-scheduler
    #scheduler
    class="demo__scheduler"
    height="parent"
    [events]="events()"
    [resources]="resources"
    [views]="views"
    [headerToolbar]="toolbar"
    [(view)]="view"
    [(date)]="date"
    [theme]="theme()"
    [editable]="true"
    [eventPopover]="true"
    [businessHours]="true"
    [navLinks]="true"
    slotMinTime="06:00"
    slotMaxTime="22:00"
    timelineMinTime="07:00"
    timelineMaxTime="20:00"
    (dateSelect)="onDateSelect($event)"
    (eventChange)="syncFromScheduler()"
    (eventAdd)="syncFromScheduler()"
  >
    <sch-scheduler-toolbar />
    <sch-scheduler-body />
  </sch-scheduler>
</main>
